<section class="crud-page">

    <div class="crud-header">
        <div>
            <h2>Categorías</h2>
        </div>

        <button id="new-category-button" class="btn btn-primary" type="button">
            <span>＋ Nueva categoría</span>
        </button>
    </div>

    <section class="crud-filters"> 
        <div class="crud-filter">
            <label for="category-search">Nombre</label>
            <input type="search" id="category-search" placeholder="Buscar por nombre..."/>
        </div>
        <div class="crud-filter">
            <label for="category-status">Estado</label>
            <select id="category-status">
                <option value="all">Todos</option>
                <option value="active">Activos</option>
                <option value="inactive">Inactivos</option>
            </select>
        </div>
        <div class="crud-filter crud-filter-button">
            <span class="crud-filter-spacer"></span>
            <button id="search-categories" class="btn btn-primary" type="button">Buscar</button>
        </div>
    </section>

    <section class="crud-table-container" id="categories-crud">   </section>

    <!-- Modal de alta y edición -->
    <div id="category-modal" class="modal-overlay" hidden>
        <div class="modal">

            <div class="modal-header">
                <h2 id="category-modal-title">Nueva categoría</h2>
                <button type="button" class="modal-close" id="category-modal-close">×</button>
            </div>
            <form id="category-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="category-name">Nombre *</label>
                        <input type="text" id="category-name" required/>
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="category-modal-cancel">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar categoría</button>
                </div>
            </form>
        </div>
    </div>
</section>
