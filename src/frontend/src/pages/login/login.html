<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>DISTRIBUIDORA LOGIN</title>
        <link rel="stylesheet" href="../../../styles/Styles.css">
    </head>
    <body>
        <main>
            <div class="container">
                <form id="form" class="login-form">
                    <h1>Distribuidora</h1>
                    <h2>Iniciar Sesión</h2>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required autocomplete="off" placeholder="tucorreo@ejemplo.com">

                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required autocomplete="off" placeholder="Minimo 8 caracteres">


                    <button type="submit">Ingresar</button>

    
                </form>
                
            </div>
        </main>
        <script type="module" src="./login.ts"></script>
    </body>
</html>
