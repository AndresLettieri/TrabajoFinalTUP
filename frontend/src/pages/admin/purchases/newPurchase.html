<section class="crud-page">
    <div class="crud-header">
        <div>
            <h2>Nueva compra</h2>
        </div>
    </div>

    <form id="purchase-form">

        <!-- Datos generales -->
        <section class="form-section">
            <h3>Datos de la compra</h3>
            <div class="form-grid-three">
                <div class="form-group-double">
                    <label for="purchase-number">Número de comprobante</label>
                    <input type="number" id="purchase-number" min="1" step="1" required/>
                </div>
                <div class="form-group-double">
                    <label for="purchase-date">Fecha</label>
                    <input type="date" id="purchase-date" required />
                </div>
                <div class="form-group-double">
                    <label for="purchase-vendor">Proveedor</label>
                    <select id="purchase-vendor" required>
                        <option value="">Seleccioná un proveedor</option>
                    </select>
                </div>
            </div>
        </section>
        <section class="form-section">
            <div class="crud-header">
                <div>
                    <h3>Productos de la compra</h3>
                </div>
                <button type="button" id="add-purchase-product" class="btn btn-primary">
                    <span>＋ Agregar producto</span>
                </button>
            </div>

            <section class="crud-table-container" id="purchase-details-container">
                <table class="crud-table">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Producto</th>
                            <th>Cantidad</th>
                            <th>Precio de compra</th>
                            <th>Subtotal</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="purchase-details"></tbody>
                </table>
            </section>
            <p id="purchase-details-error" class="form-error" role="alert"></p>
            <div class="purchase-total">
                <span>Total de la compra:</span>
                <strong id="purchase-total">$ 0,00</strong>
            </div>
        </section>
        <section class="form-section">
            <div class="form-group-double">
                <label for="purchase-observations">Observaciones (opcional)</label>
                <textarea id="purchase-observations" rows="3" maxlength="1500" placeholder="Agregá alguna observación sobre la compra..."></textarea>
            </div>
        </section>

        <p id="purchase-error" class="form-error" role="alert"></p>

        <div class="modal-actions">
            <button type="button" id="cancel-purchase-form" class="btn btn-secondary">Volver</button>
            <button type="submit" id="save-purchase-button" class="btn btn-primary">Registrar compra</button>
        </div>
    </form>   
</section>
