<section class="crud-page">

    <div class="crud-header">
        <div>
            <h2>Productos</h2>
        </div>

        <button id="new-product-button" class="btn btn-primary" type="button">
            <span>＋ Nuevo producto</span>
        </button>
    </div>

    <section class="crud-filters"> 
        <div class="crud-filter">
            <label for="product-search">Código</label>
            <input type="search" id="product-search" placeholder="Buscar por código..."/>
        </div>
        <div class="crud-filter">
            <label for="product-description-search">Descripcion</label>
            <input type="search" id="product-description-search" placeholder="Buscar por descripción..."/>
        </div>
        <div class="crud-filter">
            <label for="product-barcode-search">Código barras</label>
            <input type="search" id="product-barcode-search" placeholder="Buscar por código de barras..."/>
        </div>
        <div class="crud-filter">
            <label for="product-category-search">Categoria</label>
            <select id="product-category-search"></select>
        </div>
        <div class="crud-filter">
            <label for="product-brand-search">Marca</label>
            <select id="product-brand-search"></select>
        </div>
        <div class="crud-filter">
            <label for="product-status">Estado</label>
            <select id="product-status">
                <option value="all">Todos</option>
                <option value="active">Activos</option>
                <option value="inactive">Inactivos</option>
            </select>
        </div>
        <div class="crud-filter crud-filter-button">
            <span class="crud-filter-spacer"></span>
            <button id="search-products" class="btn btn-primary" type="button">Buscar</button>
        </div>
    </section>

    <section class="crud-table-container" id="products-crud">   </section>

    <!-- Modal de alta y edición -->
    <div id="product-modal" class="modal-overlay" hidden>
        <div class="modal">

            <div class="modal-header">
                <h2 id="product-modal-title">Nuevo producto</h2>
                <button type="button" class="modal-close" id="product-modal-close">×</button>
            </div>
            <form id="product-form">
                <div class="form-section">
                    <h3>Datos del producto</h3>

                    <div class="form-grid-double">
                        <div class="form-group-double">
                            <label for="product-code">Código</label>
                            <input type="text" id="product-code" required />
                        </div>

                        <div class="form-group-double">
                            <label for="product-barcode">Código de barras</label>
                            <input type="text" id="product-barcode" />
                        </div>

                        <div class="form-group-double form-group-full">
                            <label for="product-description">Descripción</label>
                            <input type="text" id="product-description" required />
                        </div>

                        <div class="form-group-double">
                            <label for="product-category">Categoría</label>
                            <select id="product-category" required></select>
                        </div>

                        <div class="form-group-double">
                            <label for="product-brand">Marca</label>
                            <select id="product-brand" required></select>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h3>Precios y stock</h3>

                    <div class="form-grid-double">
                        <div class="form-group-double">
                            <label for="product-price">Precio de venta</label>
                            <input type="number" id="product-price" min="0" step="0.01" required/>
                        </div>
                        <div class="form-group-double">
                            <label for="product-cost">Precio de compra</label>
                            <input type="number" id="product-cost" min="0" step="0.01" required/>
                        </div>
                        <div class="form-group-double">
                            <label for="product-stock">Stock inicial</label>
                            <input type="number" id="product-stock" min="0" step="1" required/>
                        </div>
                        <div class="form-group-double">
                            <label for="product-min-stock">Stock mínimo</label>
                            <input type="number" id="product-min-stock" min="0" step="1" required/>
                        </div>
                    </div>
                </div>
                <div class="modal-actions">
                    <button
                        type="button"
                        class="btn btn-secondary"
                        id="product-modal-cancel"
                    >
                        Cancelar
                    </button>

                    <button type="submit" class="btn btn-primary">
                        Guardar producto
                    </button>
                </div>
            </form>


        </div>
    </div>
</section>
